<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin — AuroraVPN Revenue</title>
  <meta name="aurora-api" content="http://localhost:8080" />
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <div id="nav"></div>
  <main class="wrap" style="padding-top:30px">
    <h1 style="margin:0 0 6px">Revenue dashboard</h1>
    <p style="color:var(--muted);margin-top:0">Admin only. Shows money across Stripe (web) + App Store / Google Play (mobile).</p>
    <div id="admin-msg"></div>

    <div id="admin-body" style="display:none">
      <div class="stats" style="margin:22px 0">
        <div class="stat"><div class="label">Gross revenue (all time)</div><div class="value grad" id="s-gross">—</div></div>
        <div class="stat"><div class="label">This month</div><div class="value" id="s-month">—</div></div>
        <div class="stat"><div class="label">Active subscriptions</div><div class="value" id="s-subs">—</div></div>
        <div class="stat"><div class="label">Last 30 days</div><div class="value" id="s-30">—</div></div>
      </div>
      <div class="stats" style="margin-bottom:22px">
        <div class="stat"><div class="label">Total users</div><div class="value" id="s-users">—</div></div>
        <div class="stat"><div class="label">Paying users</div><div class="value" id="s-paying">—</div></div>
        <div class="stat"><div class="label">Transactions</div><div class="value" id="s-txns">—</div></div>
        <div class="stat"><div class="label">Avg / paying user</div><div class="value" id="s-arpu">—</div></div>
      </div>

      <div class="panel" style="margin-bottom:22px">
        <h3 style="margin-top:0">Revenue — last 30 days</h3>
        <div id="chart"></div>
      </div>

      <div class="grid-2">
        <div class="panel">
          <h3 style="margin-top:0">Recent payments</h3>
          <div id="payments"></div>
        </div>
        <div class="panel">
          <h3 style="margin-top:0">Server fleet</h3>
          <div id="nodes"></div>
        </div>
      </div>
    </div>
  </main>
  <div id="footer"></div>

  <script src="assets/api.js"></script>
  <script src="assets/layout.js"></script>
  <script>
    Layout.mount();
    const msg = document.getElementById('admin-msg');

    function barChart(data) {
      if (!data.length) return '<p style="color:var(--muted)">No revenue recorded yet.</p>';
      const w = 100, max = Math.max(1, ...data.map((d) => d.cents));
      const bw = 100 / data.length;
      const bars = data.map((d, i) => {
        const h = (d.cents / max) * 150;
        return '<rect x="' + (i * bw + bw * 0.15) + '%" y="' + (160 - h) + '" width="' + (bw * 0.7) + '%" height="' + h +
          '" rx="2" fill="url(#g)"><title>' + d.day + ': ' + money(d.cents) + '</title></rect>';
      }).join('');
      return '<svg viewBox="0 0 ' + w + ' 170" preserveAspectRatio="none" style="width:100%;height:180px">' +
        '<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#4f7cff"/></linearGradient></defs>' +
        bars + '</svg>';
    }

    async function load() {
      if (!Aurora.isLoggedIn()) { msg.innerHTML = '<div class="notice err">Please <a href="account.html">log in</a> with your admin account (the email set as ADMIN_EMAIL on the backend).</div>'; return; }
      try {
        const d = await Aurora.adminOverview();
        const o = d.overview;
        document.getElementById('s-gross').textContent = money(o.grossCents);
        document.getElementById('s-month').textContent = money(o.thisMonthCents);
        document.getElementById('s-subs').textContent = o.activeSubscriptions;
        document.getElementById('s-30').textContent = money(o.last30dCents);
        document.getElementById('s-users').textContent = o.totalUsers;
        document.getElementById('s-paying').textContent = o.payingUsers;
        document.getElementById('s-txns').textContent = o.transactions;
        document.getElementById('s-arpu').textContent = money(o.payingUsers ? Math.round(o.grossCents / o.payingUsers) : 0);

        document.getElementById('chart').innerHTML = barChart(d.revenueByDay);

        document.getElementById('payments').innerHTML = d.recentPayments.length
          ? '<table><thead><tr><th>Date</th><th>Source</th><th>Plan</th><th>Amount</th><th>User</th></tr></thead><tbody>' +
            d.recentPayments.map((p) => '<tr><td>' + new Date(p.created_at).toLocaleDateString() + '</td><td>' + p.source +
              '</td><td>' + (p.plan || '—') + '</td><td>' + money(p.amount_cents, p.currency) + '</td><td>' + (p.email || '—') + '</td></tr>').join('') +
            '</tbody></table>'
          : '<p style="color:var(--muted)">No payments yet. They appear here after your first sale.</p>';

        document.getElementById('nodes').innerHTML = d.nodes.length
          ? '<table><thead><tr><th>Location</th><th>Tier</th><th>Status</th><th>Load</th></tr></thead><tbody>' +
            d.nodes.map((n) => '<tr><td>' + flagEmoji(n.country) + ' ' + n.city + '</td><td><span class="badge ' + (n.premium ? 'premium' : 'free') + '">' +
              (n.premium ? 'Premium' : 'Free') + '</span></td><td><span class="badge ' + (n.healthy ? 'on' : 'off') + '">' + (n.healthy ? 'Online' : 'Offline') +
              '</span></td><td>' + n.load + '/' + n.capacity + '</td></tr>').join('') + '</tbody></table>'
          : '<p style="color:var(--muted)">No servers registered.</p>';

        document.getElementById('admin-body').style.display = 'block';
      } catch (e) {
        if (e.status === 403) msg.innerHTML = '<div class="notice err">This account isn\'t an admin. Set ADMIN_EMAIL in the backend .env to your email, then register/log in with it.</div>';
        else if (e.status === 401) msg.innerHTML = '<div class="notice err">Session expired — <a href="account.html">log in</a> again.</div>';
        else msg.innerHTML = '<div class="notice err">Could not load dashboard: ' + e.message + '</div>';
      }
    }
    load();
  </script>
</body>
</html>
